name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Validate workflow formatting
        run: bunx prettier --check .github/workflows/ci.yml

      - name: Test
        run: bun run test

      - name: Integration tests
        run: bun run test:integration

      - name: Build
        run: bun run build

      - name: Validate rendered Compose configuration
        run: bun run docker:config
