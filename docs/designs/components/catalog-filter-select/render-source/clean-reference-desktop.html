<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FilterSelect — clean desktop reference</title><link rel="stylesheet" href="select.css"><link rel="stylesheet" href="clean-reference.css"></head>
<body><div class="clean-page">
<header class="clean-header"><div class="clean-brand">NOVA<small>ATELIER EDITORIAL</small></div><span class="clean-title">فروشگاه / فیلترهای کاتالوگ</span></header>
<main class="clean-stage">
<aside class="filter-rail" aria-label="نمونهٔ پنل فیلتر">
  <div class="rail-heading"><h1>فیلترها</h1><button type="button">حذف همه</button></div>
  <div class="clean-subsection">
    <div class="filter-select filter-select--list is-open">
      <button class="filter-select__trigger" type="button" aria-expanded="true">
        <span class="filter-select__label">دسته‌بندی</span><span class="filter-select__selected">اکسسوری</span><span class="filter-select__chevron" aria-hidden="true"><i class="chevron"></i></span>
      </button>
      <div class="filter-select__options">
        <fieldset class="filter-select__group" aria-label="دسته‌بندی نمونه">
          <legend hidden>دسته‌بندی</legend>
          <label class="filter-select__option is-selected"><input type="radio" name="desk-category" checked><span class="filter-select__indicator"><i class="checkmark"></i></span><span class="filter-select__option-label">اکسسوری</span><small class="filter-select__count">۱۲</small></label>
          <label class="filter-select__option"><input type="radio" name="desk-category"><span class="filter-select__indicator"></span><span class="filter-select__option-label">بافت</span><small class="filter-select__count">۸</small></label>
          <label class="filter-select__option"><input type="radio" name="desk-category"><span class="filter-select__indicator"></span><span class="filter-select__option-label">پیراهن</span><small class="filter-select__count">۶</small></label>
          <label class="filter-select__option"><input type="radio" name="desk-category"><span class="filter-select__indicator"></span><span class="filter-select__option-label">شلوار</span><small class="filter-select__count">۴</small></label>
        </fieldset>
        <button class="filter-select__more" type="button">مشاهدهٔ بیشتر <span class="filter-select__chevron"><i class="chevron"></i></span></button>
      </div>
    </div>
  </div>
  <section class="clean-subsection">
    <div class="clean-subsection__heading"><span>اندازه</span><small>یک انتخاب</small></div>
    <div class="clean-size-row">
      <label class="filter-select__option filter-select__option--size"><input type="radio" name="desk-size"><span class="filter-select__indicator"></span><span class="filter-select__option-label">S</span></label>
      <label class="filter-select__option filter-select__option--size is-selected"><input type="radio" name="desk-size" checked><span class="filter-select__indicator"></span><span class="filter-select__option-label">M</span></label>
      <label class="filter-select__option filter-select__option--size"><input type="radio" name="desk-size"><span class="filter-select__indicator"></span><span class="filter-select__option-label">L</span></label>
      <label class="filter-select__option filter-select__option--size"><input type="radio" name="desk-size"><span class="filter-select__indicator"></span><span class="filter-select__option-label">XL</span></label>
    </div>
  </section>
  <section class="clean-subsection">
    <div class="clean-subsection__heading"><span>رنگ</span><small>نمونهٔ رنگ و نام</small></div>
    <div class="clean-color-row">
      <label class="filter-select__option filter-select__option--swatches"><input type="radio" name="desk-color"><span class="filter-select__indicator filter-select__indicator--swatch" style="background:#cdbb9f"></span><span class="filter-select__option-label">شنّی</span></label>
      <label class="filter-select__option filter-select__option--swatches is-selected"><input type="radio" name="desk-color" checked><span class="filter-select__indicator filter-select__indicator--swatch" style="background:#7b4b59"></span><span class="filter-select__option-label">زرشکی</span></label>
      <label class="filter-select__option filter-select__option--swatches"><input type="radio" name="desk-color"><span class="filter-select__indicator filter-select__indicator--swatch" style="background:#34312f"></span><span class="filter-select__option-label">ذغالی</span></label>
    </div>
  </section>
  <section class="clean-subsection"><div class="clean-subsection__heading"><span>متریال</span><span aria-hidden="true" class="chevron"></span></div></section>
  <button class="clean-apply" type="button">نمایش نتایج</button>
</aside>
</main>
</div></body></html>
